<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Coffix Szerviz Munkalap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  
  <!-- ZXing Élő Vonalkód Olvasó + Tesseract OCR -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --accent-color: #ff9800;
      --border-color: #333;
    }
    
    body { 
      background-color: var(--bg-dark); 
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-bottom: 90px; 
    }

    .form-control, .form-select {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      font-size: 1rem;
    }
    .form-control:focus, .form-select:focus {
      background-color: #333;
      color: #fff;
      border-color: var(--accent-color);
      box-shadow: none;
    }
    .form-label { font-weight: 600; color: #bbb; margin-bottom: 4px; }

    .btn-custom {
      padding: 12px 16px;
      font-weight: 600;
      border-radius: 8px;
    }
    .btn-toggle.active { background-color: #dc3545 !important; color: white !important; border-color: #dc3545 !important; }
    .btn-issue.active { background-color: #0d6efd !important; color: white !important; border-color: #0d6efd !important; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
    }

    .stat-card {
      background-color: #252525;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid #3d3d3d;
    }
    .stat-number {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .card-order { border-left: 6px solid #6c757d; margin-bottom: 15px; }
    .status-Atveve { border-left-color: #ffc107; }
    .status-Elkeszult { border-left-color: #198754; }
    .status-Kiadva { border-left-color: #6c757d; }
    .overdue-card { border: 2px solid #dc3545 !important; border-left: 8px solid #dc3545 !important; background-color: #2a1515; }

    /* Élő kamera ablak stílusok */
    #scannerModal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #scannerVideo {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      border: 2px solid var(--accent-color);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: #1a1a1a;
      border-top: 1px solid #333;
      z-index: 1000;
      display: flex;
    }
    .bottom-nav button {
      flex: 1;
      padding: 14px;
      border: none;
      background: none;
      color: #888;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .bottom-nav button.active {
      color: var(--accent-color);
      border-top: 3px solid var(--accent-color);
      background-color: #252525;
    }

    .filter-btn {
      font-size: 0.85rem;
      padding: 6px 12px;
    }
    .filter-btn.active {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container py-3">
  <h4 class="text-center mb-3 text-warning fw-bold">☕ COFFIX SZERVIZ</h4>

  <div id="alertBanner" style="display:none;" class="alert alert-danger text-center font-weight-bold shadow-sm mb-3">
    ⚠️ <strong>Figyelem!</strong> Van olyan kávégép, ami több mint 1 hete vár javításra!
  </div>

  <!-- ÚJ ÁTVÉTEL TAB -->
  <div id="tab-new" class="tab-content">
    <div class="card p-3 shadow">
      <h5 class="card-title mb-3 text-light">➕ Új Átvétel</h5>
      
      <!-- BEOLVASÓ GOMBOK -->
      <div class="d-flex gap-2 mb-3">
        <button type="button" class="btn btn-warning btn-custom flex-fill" onclick="startLiveScanner()">
          📸 Élő Vonalkód Beolvasás
        </button>
        <label for="cameraInput" class="btn btn-outline-secondary btn-custom flex-fill text-center m-0">
          🖼️ Fotó OCR
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processOCRImage(this)">
      </div>
      <div id="scanStatus" class="text-center text-muted mb-2 small"></div>

      <div class="mb-3">
        <label class="form-label">Ügyfél Neve *</label>
        <input type="text" id="clientName" class="form-control" placeholder="Kovács Péter">
      </div>
      <div class="mb-3">
        <label class="form-label">Telefonszám *</label>
        <input type="tel" id="clientPhone" class="form-control" placeholder="+36301234567">
      </div>
      <div class="mb-3">
        <label class="form-label">Gép Márka / Típus</label>
        <input type="text" id="machineModel" class="form-control" placeholder="pl. Saeco Lirika / DeLonghi Magnifica">
      </div>
      <div class="mb-3">
        <label class="form-label">Gyári szám (S/N)</label>
        <input type="text" id="serialNumber" class="form-control" placeholder="Gép aljáról / hátuljáról">
      </div>
      <div class="mb-3">
        <label class="form-label">Gép Színe / Állapota</label>
        <input type="text" id="colorCondition" class="form-control" placeholder="pl. Fekete, karcos tető">
      </div>

      <hr class="border-secondary">

      <!-- HIBÁK -->
      <label class="form-label mb-2">🛠️ Hibajelenség / Kért Munka:</label>
      <div class="d-flex flex-wrap gap-2 mb-2">
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Karbantartás')">Karbantartás</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Daráló hiba')">Daráló hiba</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Dugulás')">Dugulás</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Folyik a víz')">Folyik a víz</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Nem ad kávét')">Nem ad kávét</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Vízkőtelenítés')">Vízkőtelenítés</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Elektronika')">Elektronika</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-issue" onclick="toggleSelection(this, 'issues', 'Hangos/Zajos')">Hangos/Zajos</button>
      </div>
      <div class="mb-3">
        <input type="text" id="customIssue" class="form-control" placeholder="✍️ Egyéb egyedi hiba...">
      </div>

      <!-- HIÁNYZÓ TARTOZÉKOK -->
      <label class="form-label mb-2 text-danger">❌ HIÁNYZÓ Tartozékok:</label>
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button type="button" class="btn btn-outline-secondary btn-custom btn-toggle" onclick="toggleSelection(this, 'missingParts', 'Víztartály')">Víztartály</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-toggle" onclick="toggleSelection(this, 'missingParts', 'Víztartály fedél')">Víztartály fedél</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-toggle" onclick="toggleSelection(this, 'missingParts', 'Csepptálca')">Csepptálca</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-toggle" onclick="toggleSelection(this, 'missingParts', 'Zaccfiók')">Zaccfiók</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-toggle" onclick="toggleSelection(this, 'missingParts', 'Tejfelszívó')">Tejfelszívó</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-toggle" onclick="toggleSelection(this, 'missingParts', 'K-egység')">K-egység</button>
        <button type="button" class="btn btn-outline-secondary btn-custom btn-toggle" onclick="toggleSelection(this, 'missingParts', 'Kávébab fedél')">Kávébab fedél</button>
      </div>

      <div class="mb-3">
        <label class="form-label">Max. Költségkeret (Ft)</label>
        <input type="number" id="maxBudget" class="form-control" placeholder="pl. 25000">
      </div>
      <div class="mb-3">
        <label class="form-label">Műhely Jegyzet (Belső)</label>
        <textarea id="internalNotes" class="form-control" rows="2" placeholder="Saját megjegyzés magadnak..."></textarea>
      </div>

      <button id="saveBtn" class="btn btn-warning btn-custom w-100 mt-2" onclick="submitWorkOrder()">💾 Munkalap Mentése</button>
    </div>
  </div>

  <!-- LISTA TAB -->
  <div id="tab-list" class="tab-content" style="display:none;">
    
    <!-- STATISZTIKA DOBOZOK -->
    <div class="row g-2 mb-3">
      <div class="col-4">
        <div class="stat-card">
          <div class="text-muted small">Folyamatban</div>
          <div id="statActive" class="stat-number">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-card">
          <div class="text-muted small">Elkészült</div>
          <div id="statReady" class="stat-number text-success">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-card">
          <div class="text-muted small">Lezárt</div>
          <div id="statDone" class="stat-number text-secondary">0</div>
        </div>
      </div>
    </div>

    <!-- KERESŐ ÉS SZŰRŐ -->
    <div class="card p-2 mb-3">
      <input type="text" id="searchInput" class="form-control mb-2" placeholder="🔍 Keresés (név, típus, S/N, ID)..." onkeyup="filterOrders()">
      <div class="d-flex gap-1 overflow-auto">
        <button class="btn btn-outline-secondary filter-btn active" onclick="setFilter('ALL', this)">Összes</button>
        <button class="btn btn-outline-secondary filter-btn" onclick="setFilter('Átvéve', this)">Átvéve</button>
        <button class="btn btn-outline-secondary filter-btn" onclick="setFilter('Elkészült', this)">Elkészült</button>
        <button class="btn btn-outline-secondary filter-btn" onclick="setFilter('Kiadva', this)">Kiadva</button>
      </div>
    </div>

    <div id="ordersContainer">⏳ Gépek betöltése...</div>
  </div>
</div>

<!-- ÉLŐ KAMERA MODAL POPUP -->
<div id="scannerModal">
  <h5 class="text-warning mb-3">Irányítsd a kamerát a vonalkódra!</h5>
  <video id="scannerVideo"></video>
  <button class="btn btn-danger btn-custom mt-3 w-100" style="max-width:300px;" onclick="stopLiveScanner()">Bezárás</button>
</div>

<div class="bottom-nav">
  <button id="nav-new" class="active" onclick="switchTab('new')">➕ ÚJ ÁTVÉTEL</button>
  <button id="nav-list" onclick="switchTab('list'); loadOrders();">📋 GÉPEK LISTÁJA</button>
</div>

<script>
  // IDE MÁSOLD BE A GOOGLE APPS SCRIPT WEBAPP URL-JÉT:
  const API_URL = "https://script.google.com/macros/s/AKfycbw19FfkwxPsMr-vx1PUB-QbNZcn6kwjIKPk_wQ_Q9rOxIQC81bJFg5gKaupMu1jfIcPHw/exec";

  let selectedIssues = [];
  let selectedMissingParts = [];
  let codeReader = null;
  let allOrdersData = [];
  let currentFilterStatus = 'ALL';

  // FÜLEK KÖZÖTTI VÁLTÁS
  function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.bottom-nav button').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabName).style.display = 'block';
    document.getElementById('nav-' + tabName).classList.add('active');
  }

  function toggleSelection(btn, type, value) {
    btn.classList.toggle('active');
    let list = type === 'issues' ? selectedIssues : selectedMissingParts;
    let index = list.indexOf(value);
    if (index > -1) { list.splice(index, 1); } else { list.push(value); }
  }

  // 1. ÉLŐ KAMERÁS VONALKÓD SZKENNER
  function startLiveScanner() {
    document.getElementById('scannerModal').style.display = 'flex';
    codeReader = new ZXing.BrowserMultiFormatReader();
    
    codeReader.decodeFromVideoDevice(undefined, 'scannerVideo', (result, err) => {
      if (result) {
        document.getElementById('serialNumber').value = result.text;
        document.getElementById('scanStatus').innerHTML = "✅ Sikeres élő beolvasás (S/N): " + result.text;
        stopLiveScanner();
      }
    }).catch(err => {
      console.error(err);
      document.getElementById('scanStatus').innerHTML = "❌ Nem sikerült elindítani a kamerát.";
    });
  }

  function stopLiveScanner() {
    if (codeReader) {
      codeReader.reset();
    }
    document.getElementById('scannerModal').style.display = 'none';
  }

  // 2. FOTÓ ALAPÚ SZÖVEGES OCR
  function processOCRImage(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const statusDiv = document.getElementById('scanStatus');
    statusDiv.innerHTML = "⏳ Fotó elemzése (OCR)...";

    Tesseract.recognize(file, 'eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          statusDiv.innerHTML = `⏳ Olvasás: ${Math.round(m.progress * 100)}%`;
        }
      }
    }).then(({ data: { text } }) => {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      
      if (lines.length > 0) {
        const serialInput = document.getElementById('serialNumber');
        if (!serialInput.value) {
          const snMatch = text.match(/[A-Z0-9]{8,}/i);
          if (snMatch) serialInput.value = snMatch[0];
        }
        
        const modelInput = document.getElementById('machineModel');
        if (!modelInput.value && lines[0]) {
          modelInput.value = lines[0].substring(0, 30);
        }
      }
      statusDiv.innerHTML = "✅ Fotó feldolgozva!";
    }).catch(err => {
      statusDiv.innerHTML = "❌ Hiba a fotó olvasása során.";
    });
  }

  function calculateDaysInService(dateString) {
    if (!dateString) return 0;
    let cleanDateStr = dateString.toString().replace(/\./g, '-');
    let orderDate = new Date(cleanDateStr);
    if (isNaN(orderDate.getTime())) return 0;
    let diffTime = Math.abs(new Date() - orderDate);
    return Math.floor(diffTime / (1000 * 60 * 60 * 24));
  }

  function generateSmsText(price) {
    return `Szia! A szervizre leadott kávégéped elkészült és átvehető. Fizetendő végösszeg: ${price} Ft. Az átvétellel kapcsolatban egyeztetés szükséges. Üdvözlettel, Coffix`;
  }

  // 3. MUNKALAP MENTÉSE
  function submitWorkOrder() {
    let allIssues = [...selectedIssues];
    const customIssueVal = document.getElementById('customIssue').value.trim();
    if (customIssueVal) allIssues.push(customIssueVal);

    const data = {
      clientName: document.getElementById('clientName').value,
      clientPhone: document.getElementById('clientPhone').value,
      machineModel: document.getElementById('machineModel').value,
      serialNumber: document.getElementById('serialNumber').value,
      colorCondition: document.getElementById('colorCondition').value,
      issues: allIssues,
      missingParts: selectedMissingParts,
      maxBudget: document.getElementById('maxBudget').value,
      internalNotes: document.getElementById('internalNotes').value
    };

    if (!data.clientName || !data.clientPhone) {
      alert("Kérlek add meg az Ügyfél nevét és telefonszámát!");
      return;
    }

    document.getElementById('saveBtn').disabled = true;
    document.getElementById('saveBtn').innerText = "Mentés...";

    fetch(API_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveOrder', payload: data })
    })
    .then(res => res.json())
    .then(res => {
      if(res.success) {
        alert("Sikeres mentés! Munkalapszám: " + res.id);
        location.reload();
      } else {
        alert("Hiba történt a mentés során: " + (res.error || "Ismeretlen hiba"));
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtn').innerText = "💾 Munkalap Mentése";
      }
    })
    .catch(err => {
      console.error(err);
      alert("Hiba a hálózati kapcsolatban.");
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('saveBtn').innerText = "💾 Munkalap Mentése";
    });
  }

  // 4. GÉPEK LISTÁJÁNAK BETÖLTÉSE (SZŰRÉSSEL ÉS STATISZTIKÁVAL)
  function loadOrders() {
    const container = document.getElementById('ordersContainer');
    container.innerHTML = '<div class="text-center text-muted my-4">⏳ Adatok betöltése a táblázatból...</div>';
    document.getElementById('alertBanner').style.display = 'none';

    fetch(API_URL + "?action=getOrders", {
      method: 'GET',
      mode: 'cors',
      redirect: 'follow'
    })
    .then(res => {
      if (!res.ok) throw new Error("Hálózati hiba: " + res.status);
      return res.json();
    })
    .then(orders => {
      allOrdersData = orders || [];
      updateStatistics();
      renderOrdersList();
    })
    .catch(err => {
      console.error(err);
      container.innerHTML = `<div class="alert alert-danger text-center">❌ Hiba történt az adatok betöltésekor.<br><small>${err.message}</small></div>`;
    });
  }

  function updateStatistics() {
    let active = 0, ready = 0, done = 0;
    allOrdersData.forEach(o => {
      if (o.status === 'Átvéve') active++;
      else if (o.status === 'Elkészült') ready++;
      else if (o.status === 'Kiadva') done++;
    });
    document.getElementById('statActive').innerText = active;
    document.getElementById('statReady').innerText = ready;
    document.getElementById('statDone').innerText = done;
  }

  function setFilter(status, btn) {
    currentFilterStatus = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderOrdersList();
  }

  function filterOrders() {
    renderOrdersList();
  }

  function renderOrdersList() {
    const container = document.getElementById('ordersContainer');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    let hasOverdueOrder = false;

    let filtered = allOrdersData.filter(o => {
      // Státusz szűrő
      if (currentFilterStatus !== 'ALL' && o.status !== currentFilterStatus) return false;

      // Kereső mező
      if (searchTerm) {
        const text = `${o.id} ${o.clientName} ${o.clientPhone} ${o.machineModel} ${o.serialNumber}`.toLowerCase();
        return text.includes(searchTerm);
      }
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="alert alert-dark text-center my-3">Nincs a feltételeknek megfelelő gép.</div>';
      return;
    }

    let html = '';
    filtered.forEach(o => {
      let days = calculateDaysInService(o.date);
      let isOverdue = (o.status === 'Átvéve' && days >= 7);

      if (isOverdue) hasOverdueOrder = true;

      html += `
        <div class="card p-3 shadow-sm card-order status-${o.status} ${isOverdue ? 'overdue-card' : ''}">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h5 class="m-0 text-light"><strong>${o.id}</strong> - ${o.machineModel || 'Kávégép'}</h5>
            <span class="badge bg-secondary">${o.status}</span>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="text-muted">Beérkezett: ${o.date || '-'}</small>
            <span class="badge ${days >= 7 && o.status === 'Átvéve' ? 'bg-danger' : 'bg-dark text-light'} border border-secondary">
              ⏱ ${days} napja
            </span>
          </div>

          ${isOverdue ? `
            <div class="alert alert-danger py-1 px-2 my-1 small fw-bold">
              ⚠️ Figyelem: Több mint 1 hete munkára vár!
            </div>
          ` : ''}

          <p class="mb-1"><strong>Ügyfél:</strong> ${o.clientName} (${o.clientPhone})</p>
          ${o.serialNumber ? `<p class="mb-1 text-muted small"><strong>S/N:</strong> ${o.serialNumber}</p>` : ''}
          <p class="mb-1 text-secondary"><strong>Hibák:</strong> ${o.issues || 'Nincs megadva'}</p>
          ${o.missingParts ? `<p class="mb-1 text-danger"><strong>Hiányzik:</strong> ${o.missingParts}</p>` : ''}
          ${o.maxBudget ? `<p class="mb-1 text-info"><strong>Max Keret:</strong> ${o.maxBudget} Ft</p>` : ''}
          ${o.internalNotes ? `<p class="mb-1 text-warning small"><strong>Jegyzet:</strong> ${o.internalNotes}</p>` : ''}
          ${o.totalPrice ? `<p class="mb-1 text-success fw-bold"><strong>Végösszeg:</strong> ${o.totalPrice} Ft</p>` : ''}
          
          <div class="mt-3 d-flex flex-wrap gap-2">
            ${o.status !== 'Elkészült' && o.status !== 'Kiadva' ? `
              <button class="btn btn-sm btn-success btn-custom flex-fill" onclick="markAsReady(${o.rowIndex}, '${o.clientPhone}')">✅ Elkészült + SMS</button>
            ` : ''}
            ${o.status === 'Elkészült' ? `
              <button class="btn btn-sm btn-secondary btn-custom flex-fill" onclick="markAsDone(${o.rowIndex})">📦 Kiadva / Lezárva</button>
              <a class="btn btn-sm btn-outline-success btn-custom flex-fill" href="sms:${o.clientPhone}?body=${encodeURIComponent(generateSmsText(o.totalPrice))}">📲 SMS Újra</a>
            ` : ''}
          </div>
        </div>
      `;
    });

    if (hasOverdueOrder) {
      document.getElementById('alertBanner').style.display = 'block';
    }

    container.innerHTML = html;
  }

  function markAsReady(rowIndex, phone) {
    let price = prompt("Add meg a fizetendő végösszeget (Ft):");
    if (price === null) return;

    fetch(API_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'updateStatus', payload: { rowIndex: rowIndex, status: 'Elkészült', totalPrice: price } })
    })
    .then(res => res.json())
    .then(() => {
      let msg = generateSmsText(price);
      window.location.href = `sms:${phone}?body=${encodeURIComponent(msg)}`;
      loadOrders();
    });
  }

  function markAsDone(rowIndex) {
    fetch(API_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'updateStatus', payload: { rowIndex: rowIndex, status: 'Kiadva' } })
    })
    .then(res => res.json())
    .then(() => {
      loadOrders();
    });
  }
</script>
</body>
</html>
